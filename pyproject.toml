[project]
name = "quant-strategies"
version = "0.1.0"
description = "可复现的量化策略、变体、测试与回测归档"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=1.5",
  "pyarrow>=14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["strategies", "tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py310"
