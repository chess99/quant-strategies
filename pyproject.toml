[project]
name = "quant-strategies"
version = "0.1.0"
description = "可复现的量化策略、变体、测试与回测归档"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=1.5",
  "pyarrow>=14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
research = [
  "akshare>=1.18.54",
  "pyqlib==0.9.7",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "TA-Lib>=0.6.8",
  "lightgbm>=4.6",
  "xgboost>=3.0",
  "cvxpy>=1.7",
  "optuna>=4.6",
  "scikit-learn>=1.6",
]
torch = [
  "torch==2.6.0",
]

[tool.pytest.ini_options]
testpaths = ["strategies", "tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# 不可变归档必须保留平台实际运行源码；聚宽全局 API 在本地静态分析中没有定义。
"strategies/**/backtests/**/source.py" = ["F405", "F821", "F841"]
"studies/**/results/**/source.py" = ["F405", "F821", "F841"]
